<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Scraper | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background: #0f0f13;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 242, 254, 0.08), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(255, 0, 85, 0.08), transparent 25%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: fadeUp 0.6s ease-out;
        }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .logo-text {
            font-size: 28px;
            font-weight: 600;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p.subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus { outline: none; border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.2); }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3); }
        .admin-link { display: block; margin-top: 25px; color: #888; font-size: 13px; text-decoration: none; transition: 0.3s; }
        .admin-link:hover { color: #00f2fe; }
        #msg { color: #00ff88; font-size: 13px; margin-top: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="logo-text">Multi-Scraper Tool</div>
        <p class="subtitle">Premium Data Extraction Engine</p>
        
        <form action="/register" method="post" id="regForm">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Create Account</button>
        </form>
        <p id="msg"></p>
        
        <a href="/admin" class="admin-link">Go to Admin Panel →</a>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const res = await fetch('/register', { method: 'POST', body: formData });
            const data = await res.json();
            document.getElementById('msg').innerText = data.message || data.error;
            document.getElementById('msg').style.color = data.error ? '#ff4444' : '#00ff88';
        });
    </script>
</body>
</html>
