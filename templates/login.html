<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Scraper - Login</title>
    <style>
        body {
            background-color: #0d1117; color: white; font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
        }
        .box {
            background: #161b22; padding: 40px; border-radius: 12px; width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center;
        }
        h2 { color: #00d2ff; margin-bottom: 20px; }
        input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px;
            border: 1px solid #30363d; background: #0d1117; color: white; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 12px; background: #00d2ff; color: black;
            border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
        button:hover { background: #00b8e6; }
        .toggle-link { color: #00d2ff; cursor: pointer; text-decoration: underline; }
        .error { color: #ff4a4a; font-size: 14px; margin-top: 10px; }
        .success-msg { color: #00ff88; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="box">
        <h2 id="form-title">Login</h2>
        
        <div id="status-msg" class="error"></div>

        <form id="auth-form" action="/login" method="post">
            <input type="email" name="email" id="email" placeholder="Email Address" required>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <button type="submit" id="submit-btn">Login</button>
        </form>

        <p style="margin-top: 20px; font-size: 14px; color: #8b949e;">
            <span id="toggle-text">Don't have an account? </span>
            <span id="toggle-link" class="toggle-link" onclick="toggleForm()">Create Account</span>
        </p>
    </div>

    <script>
        let isLogin = true;

        function toggleForm() {
            // URL se error/success parameters remove karein
            window.history.replaceState({}, document.title, window.location.pathname);

            isLogin = !isLogin;
            const title = document.getElementById('form-title');
            const btn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');
            const toggleLink = document.getElementById('toggle-link');
            const form = document.getElementById('auth-form');
            const statusMsg = document.getElementById('status-msg');

            // Purana error/success message hata dein
            statusMsg.innerText = "";
            statusMsg.className = ""; 

            if (isLogin) {
                title.innerText = "Login";
                btn.innerText = "Login";
                form.action = "/login";
                toggleText.innerText = "Don't have an account? ";
                toggleLink.innerText = "Create Account";
            } else {
                title.innerText = "Create Account";
                btn.innerText = "Create Account";
                form.action = "/register";
                toggleText.innerText = "Already have an account? ";
                toggleLink.innerText = "Login";
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const msgBox = document.getElementById('status-msg');
        
        if (urlParams.has('error')) {
            msgBox.className = 'error';
            msgBox.innerText = urlParams.get('error');
        } else if (urlParams.has('success')) {
            msgBox.className = 'success-msg';
            msgBox.innerText = urlParams.get('success');
        }
    </script>
</body>
</html>
