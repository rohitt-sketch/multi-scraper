<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Scraper | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f0f13; color: #fff; padding: 40px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        h1 { font-size: 24px; background: linear-gradient(90deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .header-right { display: flex; align-items: center; gap: 20px; }
        .user-email { color: #888; font-size: 14px; }
        
        .logout-btn { color: #ff4444; text-decoration: none; font-size: 14px; border: 1px solid #ff4444; padding: 8px 15px; border-radius: 8px; transition: 0.3s; }
        .logout-btn:hover { background: #ff4444; color: #fff; }

        .main-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255,255,255,0.05); padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        textarea { width: 100%; height: 120px; padding: 15px; font-size: 14px; background: rgba(0,0,0,0.3); color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; resize: vertical; outline: none; }
        textarea:focus { border-color: #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.1); }
        
        .controls { display: flex; gap: 15px; margin-top: 15px; align-items: center; }
        
        select { padding: 12px; background: #1a1a24; color: #fff; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 15px; outline: none; cursor: pointer; }
        
        .btn-action { padding: 12px 25px; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s; }
        .btn-status-check { background: #ffaa00; color: #000; }
        .btn-status-check:hover:not(:disabled) { background: #ffc233; transform: translateY(-2px); }
        .btn-full-scan { background: linear-gradient(90deg, #00f2fe, #4facfe); color: #000; }
        .btn-full-scan:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { background: #333; color: #888; cursor: not-allowed; }
        
        .loader { display: none; color: #00f2fe; font-weight: 500; margin-top: 15px; font-size: 14px; }
        
        .copy-bar { display: none; margin-top: 25px; margin-bottom: 10px; gap: 10px; }
        .btn-copy { padding: 10px 18px; border: none; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; color: #000; background: #00ff88; }
        .btn-copy:hover { background: #33ffa0; transform: translateY(-2px); }

        .table-container { max-height: 450px; overflow-y: auto; margin-top: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.2); font-size: 13px; }
        th { background: #1a1a24; color: #00f2fe; padding: 15px; text-align: left; font-weight: 500; position: sticky; top: 0; z-index: 10; }
        td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ccc; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .success { color: #00ff88; font-weight: 600; }
        .failed { color: #ff4444; font-weight: 600; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f0f13; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Premium Multi-Scraper</h1>
        
        <!-- Yahan Logout Link Update kiya gaya hai aur User Email dikhaya gaya hai -->
        <div class="header-right">
            <span class="user-email">👤 {{ user }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="main-card">
        <p style="color: #888; margin-bottom: 15px; font-size: 14px;">Video links niche dalein (Ek line mein ek link):</p>
        <textarea id="urlInput" placeholder="https://www.tiktok.com/@user/video/123456...&#10;https://www.youtube.com/watch?v=..."></textarea>
        
        <div class="controls">
            <select id="platformSelect">
                <option value="tiktok">TikTok</option>
                <option value="youtube">YouTube</option>
            </select>

            <!-- TikTok Status Button -->
            <button onclick="startScraping('status')" id="btnStatus" class="btn-action btn-status-check">⚡ Fast Status Check</button>
            
            <!-- Full Scan Button -->
            <button onclick="startScraping('full')" id="btnFull" class="btn-action btn-full-scan">🔍 Full Data Scrape</button>
        </div>
        
        <div id="loader" class="loader">⏳ Processing, please wait...</div>

        <div class="copy-bar" id="copyBar">
            <button class="btn-copy" onclick="copyData()">📋 Copy Results (Excel)</button>
        </div>

        <div id="resultsArea" style="display:none;">
            <div class="table-container">
                <table id="resultsTable">
                    <thead id="tableHead"></thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentScrapedData = [];
        let currentMode = "";
        
        // Platform change hone par buttons update karein
        document.getElementById('platformSelect').addEventListener('change', function() {
            const platform = this.value;
            if(platform === 'youtube') {
                document.getElementById('btnStatus').style.display = 'none'; // YouTube ke liye fast status hide
                document.getElementById('btnFull').innerHTML = '▶️ YouTube Full Scrape';
            } else {
                document.getElementById('btnStatus').style.display = 'block';
                document.getElementById('btnFull').innerHTML = '🔍 TikTok Full Scrape';
            }
        });

        async function startScraping(mode) {
            const urls = document.getElementById('urlInput').value;
            const platform = document.getElementById('platformSelect').value;
            
            if(!urls.trim()) { alert('Please enter at least one link!'); return; }

            currentMode = mode;
            document.getElementById('btnStatus').disabled = true;
            document.getElementById('btnFull').disabled = true;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultsArea').style.display = 'none';
            document.getElementById('copyBar').style.display = 'none';
            
            if(mode === 'status') {
                document.getElementById('loader').innerText = "⚡ Checking status (Fast Mode)...";
            } else {
                document.getElementById('loader').innerText = `⏳ Fetching full data from ${platform.toUpperCase()}...`;
            }

            const formData = new FormData();
            formData.append('urls', urls);

            let endpoint = '/scrape_tiktok';
            if (platform === 'youtube') endpoint = '/scrape_youtube';
            else if (mode === 'status') endpoint = '/check_status';

            try {
                const response = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await response.json();
                
                currentScrapedData = data.results;
                renderTable(mode, data.results);
                
                document.getElementById('resultsArea').style.display = 'block';
                document.getElementById('copyBar').style.display = 'flex';

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('btnStatus').disabled = false;
                document.getElementById('btnFull').disabled = false;
                document.getElementById('loader').style.display = 'none';
            }
        }

        function renderTable(mode, results) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            
            if (mode === 'status') {
                thead.innerHTML = `<tr><th>Status</th><th>Video URL</th></tr>`;
                results.forEach(item => {
                    const tr = document.createElement('tr');
                    const isActive = item.status === 'Active';
                    tr.innerHTML = `
                        <td class="${isActive ? 'success' : 'failed'}">${item.status}</td>
                        <td style="max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${item.url}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                thead.innerHTML = `
                    <tr>
                        <th>Status</th><th>Title</th><th>Author</th><th>Views</th>
                        <th>Likes</th><th>Duration</th><th>Date</th><th>Subs</th>
                    </tr>
                `;
                results.forEach(item => {
                    const tr = document.createElement('tr');
                    const isSuccess = item.status === 'Success';
                    tr.innerHTML = `
                        <td class="${isSuccess ? 'success' : 'failed'}">${item.status}</td>
                        <td style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${item.title}">${item.title}</td>
                        <td>${item.author}</td>
                        <td><b>${item.views}</b></td>
                        <td>${item.likes}</td>
                        <td>${item.duration}</td>
                        <td>${item.date}</td>
                        <td>${item.subs}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function copyData() {
            if (currentScrapedData.length === 0) return;
            let textToCopy = "";
            
            if(currentMode === 'status') {
                textToCopy = "Status\tURL\n";
                currentScrapedData.forEach(item => {
                    textToCopy += `${item.status}\t${item.url}\n`;
                });
            } else {
                textToCopy = "Status\tTitle\tAuthor\tViews\tLikes\tDuration\tDate\tSubs\n";
                currentScrapedData.forEach(item => {
                    textToCopy += `${item.status}\t${item.title}\t${item.author}\t${item.views}\t${item.likes}\t${item.duration}\t${item.date}\t${item.subs}\n`;
                });
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("✅ Data copy ho gaya! Excel/Sheet mein paste karein.");
            });
        }
    </script>
</body>
</html>
