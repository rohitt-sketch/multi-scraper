<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pro Scraper | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-dark: #0a0a0f;
            --glass-bg: rgba(20, 20, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body { 
            background: var(--bg-dark); color: #fff; padding: 40px; min-height: 100vh;
            background-image: radial-gradient(circle at 15% 50%, rgba(0, 242, 254, 0.08), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(79, 172, 254, 0.08), transparent 25%);
        }

        /* Header */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); 
        }
        h1 { 
            font-size: 28px; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 20px; }
        .user-email { color: #aaa; font-size: 14px; font-weight: 500; }
        
        .logout-btn { 
            color: #ff4a4a; text-decoration: none; font-size: 14px; font-weight: 600;
            border: 1px solid rgba(255, 74, 74, 0.3); padding: 8px 16px; border-radius: 8px; transition: 0.3s; 
        }
        .logout-btn:hover { background: rgba(255, 74, 74, 0.1); box-shadow: 0 0 15px rgba(255, 74, 74, 0.2); }

        .admin-btn { 
            background: linear-gradient(135deg, #ffaa00, #ff8800); color: #000; 
            text-decoration: none; padding: 10px 20px; border-radius: 8px; 
            font-weight: 800; font-size: 14px; transition: 0.3s; border: none; 
        }
        .admin-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 170, 0, 0.3); }

        /* Main Card */
        .main-card { 
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); padding: 40px; border-radius: 24px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        textarea { 
            width: 100%; height: 150px; padding: 20px; font-size: 15px; 
            background: rgba(0,0,0,0.4); color: #fff; border: 1px solid var(--glass-border); 
            border-radius: 12px; resize: vertical; outline: none; transition: 0.3s;
        }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(0, 242, 254, 0.15); }
        
        .controls { display: flex; gap: 20px; margin-top: 25px; align-items: center; flex-wrap: wrap; }
        
        select { 
            padding: 15px 20px; background: rgba(0,0,0,0.6); color: #fff; 
            border: 1px solid var(--glass-border); border-radius: 12px; font-size: 15px; 
            outline: none; cursor: pointer; font-weight: 600;
        }
        select:focus { border-color: var(--primary); }

        .btn-action { 
            padding: 15px 30px; border: none; border-radius: 12px; font-weight: 800; 
            font-size: 15px; cursor: pointer; transition: 0.3s; letter-spacing: 0.5px;
        }
        .btn-status-check { background: linear-gradient(135deg, #ffaa00, #ff8800); color: #000; }
        .btn-status-check:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(255, 170, 0, 0.4); }
        
        .btn-full-scan { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; }
        .btn-full-scan:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4); }
        
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        /* Loader Animation */
        .loader { display: none; color: var(--primary); font-weight: 600; margin-top: 25px; font-size: 15px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

        /* Copy Bar */
        .copy-bar { display: none; margin-top: 30px; margin-bottom: 15px; gap: 15px; }
        .btn-copy { 
            padding: 12px 25px; border: none; border-radius: 10px; font-weight: 800; 
            font-size: 14px; cursor: pointer; transition: 0.3s; color: #000; 
            background: linear-gradient(135deg, #00ff88, #00cc66); 
        }
        .btn-copy:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0, 255, 136, 0.3); }

        /* Table */
        .table-container { 
            max-height: 500px; overflow-y: auto; margin-top: 20px; 
            border-radius: 16px; border: 1px solid var(--glass-border); background: rgba(0,0,0,0.3);
        }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { 
            background: rgba(10, 10, 15, 0.95); color: var(--primary); padding: 18px; 
            text-align: left; font-weight: 800; position: sticky; top: 0; z-index: 10; 
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);
        }
        td { padding: 15px 18px; border-bottom: 1px solid rgba(255,255,255,0.03); color: #ccc; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .success { color: #00ff88; font-weight: 800; text-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
        .failed { color: #ff4a4a; font-weight: 800; text-shadow: 0 0 10px rgba(255, 74, 74, 0.3); }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Footer */
        .app-footer { text-align: center; margin-top: 50px; font-size: 14px; color: #666; letter-spacing: 1px; }
        .app-footer span { color: var(--primary); font-weight: 800; text-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ Premium Multi-Scraper</h1>
        <div class="header-right">
            {% if is_admin %}
                <a href="/admin/approvals" class="admin-btn">👑 Admin Panel</a>
            {% endif %}
            <span class="user-email">👤 {{ user }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="main-card">
        <p style="color: #aaa; margin-bottom: 20px; font-size: 15px; font-weight: 500;">Paste your video links below (One link per line):</p>
        <textarea id="urlInput" placeholder="https://www.tiktok.com/...&#10;https://www.youtube.com/..."></textarea>
        
        <div class="controls">
            <select id="platformSelect">
                <option value="tiktok">TikTok</option>
                <option value="youtube">YouTube</option>
                <option value="okru">OK.ru</option>
                <option value="dailymotion">Dailymotion</option>
                <option value="vk">VK.com</option>
            </select>
            <button onclick="startScraping('status')" id="btnStatus" class="btn-action btn-status-check">⚡ Fast Status Check</button>
            <button onclick="startScraping('full')" id="btnFull" class="btn-action btn-full-scan">🔍 Full Scrape</button>
        </div>
        
        <div id="loader" class="loader">⏳ Processing your request, please wait...</div>

        <div class="copy-bar" id="copyBar">
            <button class="btn-copy" onclick="copyData()">📋 Copy Results to Excel</button>
        </div>

        <div id="resultsArea" style="display:none;">
            <div class="table-container">
                <table id="resultsTable">
                    <thead id="tableHead"></thead>
                    <tbody id="resultsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="app-footer">
        Designed & Developed by <span>Rohit Joshi</span>
    </div>

    <script>
        let currentScrapedData = [];
        let currentMode = "";

        function escapeHtml(text) {
            if (text === null || text === undefined) return "-";
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updatePlatformUI() {
            const platform = document.getElementById('platformSelect').value;
            const btnStatus = document.getElementById('btnStatus');
            const btnFull = document.getElementById('btnFull');
            
            if (platform === 'youtube') { 
                btnStatus.style.display = 'none'; 
                btnFull.style.display = 'block';
                btnFull.innerHTML = '▶️ YouTube Full Scrape';
            } else if (platform === 'vk') {
                btnStatus.style.display = 'block'; 
                btnFull.style.display = 'none';
            } else { 
                btnStatus.style.display = 'block'; 
                btnFull.style.display = 'block';
                btnFull.innerHTML = `🔍 ${platform.charAt(0).toUpperCase() + platform.slice(1)} Full Scrape`;
            }
        }

        document.getElementById('platformSelect').addEventListener('change', updatePlatformUI);
        updatePlatformUI();

        async function startScraping(mode) {
            const urls = document.getElementById('urlInput').value;
            const platform = document.getElementById('platformSelect').value;
            
            if (!urls.trim()) { alert('Please enter at least one link!'); return; }

            currentMode = mode;
            document.getElementById('btnStatus').disabled = true;
            document.getElementById('btnFull').disabled = true;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('resultsArea').style.display = 'none';
            document.getElementById('copyBar').style.display = 'none';
            
            if (mode === 'status') {
                document.getElementById('loader').innerText = "⚡ Checking status (Fast Mode)...";
            } else {
                document.getElementById('loader').innerText = `⏳ Fetching full data from ${platform.toUpperCase()}...`;
            }

            const formData = new FormData();
            formData.append('urls', urls);
            formData.append('platform', platform); 

            let endpoint = `/scrape_${platform}`;
            if (mode === 'status') endpoint = '/check_status';

            try {
                const response = await fetch(endpoint, { method: 'POST', body: formData });
                if (response.status === 401) { window.location.href = '/'; return; }
                
                const data = await response.json();
                if (!response.ok || data.error) { throw new Error(data.error || 'Server error occurred'); }
                
                currentScrapedData = data.results || [];
                renderTable(mode, currentScrapedData);
                
                document.getElementById('resultsArea').style.display = 'block';
                document.getElementById('copyBar').style.display = 'flex';

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('btnStatus').disabled = false;
                document.getElementById('btnFull').disabled = false;
                document.getElementById('loader').style.display = 'none';
            }
        }

        function renderTable(mode, results) {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            
            if (mode === 'status') {
                thead.innerHTML = `<tr><th>Status</th><th>Video URL</th></tr>`;
                results.forEach(item => {
                    const tr = document.createElement('tr');
                    const isActive = item.status === 'Active';
                    tr.innerHTML = `
                        <td class="${isActive ? 'success' : 'failed'}">${escapeHtml(item.status)}</td>
                        <td style="max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(item.url)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                thead.innerHTML = `
                    <tr>
                        <th>Status</th><th>Title</th><th>Author</th><th>Views</th>
                        <th>Likes</th><th>Duration</th><th>Date</th><th>Subs</th>
                    </tr>
                `;
                results.forEach(item => {
                    const tr = document.createElement('tr');
                    const isSuccess = item.status === 'Active';
                    tr.innerHTML = `
                        <td class="${isSuccess ? 'success' : 'failed'}">${escapeHtml(item.status)}</td>
                        <td style="max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</td>
                        <td>${escapeHtml(item.author)}</td>
                        <td><b>${escapeHtml(item.views)}</b></td>
                        <td>${escapeHtml(item.likes)}</td>
                        <td>${escapeHtml(item.duration)}</td>
                        <td>${escapeHtml(item.date)}</td>
                        <td>${escapeHtml(item.subs)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        function copyData() {
            if (currentScrapedData.length === 0) return;
            let textToCopy = "";
            
            if (currentMode === 'status') {
                textToCopy = "Status\tURL\n";
                currentScrapedData.forEach(item => {
                    textToCopy += `${item.status}\t${item.url}\n`;
                });
            } else {
                textToCopy = "Status\tTitle\tAuthor\tViews\tLikes\tDuration\tDate\tSubs\n";
                currentScrapedData.forEach(item => {
                    textToCopy += `${item.status}\t${item.title}\t${item.author}\t${item.views}\t${item.likes}\t${item.duration}\t${item.date}\t${item.subs}\n`;
                });
            }

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("✅ Data copied to clipboard! You can paste it in Excel/Sheet.");
            });
        }
    </script>
</body>
</html>
