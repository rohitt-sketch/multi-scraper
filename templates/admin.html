<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Approvals</title>
    <style>
        body { background: #0f0f13; color: white; font-family: Arial, sans-serif; padding: 40px; }
        .container { max-width: 800px; margin: auto; background: #1a1a24; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { color: #00f2fe; border-bottom: 1px solid #333; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-approve { background: #00ff88; color: black; }
        .btn-approve:hover { background: #33ffa0; transform: translateY(-2px); }
        .btn-back { background: #333; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; display: inline-block; margin-bottom: 20px; transition: 0.3s;}
        .btn-back:hover { background: #555; }
        .status-pending { color: #ffaa00; font-weight: bold; }
        .status-approved { color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
        <h2>👑 Admin User Approvals</h2>
        
        <table>
            <thead>
                <tr>
                    <th>User Email</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user[0] }}</td>
                    <td class="{% if user[1] == 'pending' %}status-pending{% else %}status-approved{% endif %}">
                        {{ user[1] | upper }}
                    </td>
                    <td>
                        {% if user[1] == 'pending' %}
                        <form action="/admin/approve" method="post" style="margin:0;">
                            <input type="hidden" name="target_email" value="{{ user[0] }}">
                            <button type="submit" class="btn btn-approve">Approve</button>
                        </form>
                        {% else %}
                        <span style="color:#888;">Already Approved</span>
                        {% endif %}
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" style="text-align:center; color:#888;">No other users have registered yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
